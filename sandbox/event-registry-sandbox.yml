finding: >
  There is no sandbox in the payments-provider sense of the word. A team integrating Event
  Registry cannot run a test suite without either burning production tokens or building their
  own mocks. The repo's examples/ directory (search-articles.json, search-events.json,
  suggest-concepts.json) is the closest thing available to fixture data.
