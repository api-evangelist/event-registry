source: >
  Derived from the 401/429 responses declared in openapi/event-registry-*-openapi.yml and the
  components.schemas.ErrorResponse envelope, enriched from Event Registry's own first-party
  error classifier at
  https://raw.githubusercontent.com/EventRegistry/newsapi-mcp/main/src/types.ts
  (classifyError) and
  https://raw.githubusercontent.com/EventRegistry/newsapi-mcp/main/src/errors.ts
