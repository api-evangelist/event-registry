finding: >
  The OpenAPI declares only 401 and 429. Six further statuses the API genuinely returns —
  including the 503 concurrency signal that every integrator will hit — are documented
  nowhere in the spec and only in the provider's MCP server source. The spec understates the
  real error surface by a factor of four.
