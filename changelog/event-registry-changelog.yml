finding: >
  A nine-year gap. The consumer-facing API changelog has been dormant since 2017 while the
  API itself demonstrably kept changing — the 2026 MCP releases add conceptOper,
  categoryOper, dateMention filters and new sort values that must exist on the REST API to
  be callable, yet none of them appears in the API changelog. An integrator on the REST API
  has no way to learn about a change except by reading the MCP server's release notes.
